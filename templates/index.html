<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>godown</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="ticket">
    <div class="topbar">
      <button id="langToggle" type="button" class="lang-toggle" aria-label="Switch language">EN</button>
    </div>

    <div class="ticket-top">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8L12 3L21 8V16L12 21L3 16V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M3 8L12 13L21 8" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M12 13V21" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="ticket-heading">
        <h1>godown</h1>
        <p class="tagline" data-i18n="tagline">リンクを渡すと、荷物を受け取って梱包します</p>
      </div>
      <div class="status-chip" id="statusChip" data-state="idle" data-i18n="status_idle">待機中</div>
    </div>

    <div class="perforation" aria-hidden="true"></div>

    <form id="checkForm" class="ticket-body">
      <div class="line">
        <label for="url">SOURCE</label>
        <input id="url" type="text" placeholder="https://gofile.io/d/XXXXXX" autocomplete="off" spellcheck="false">
      </div>

      <div class="line line-password">
        <label class="toggle">
          <input id="usePassword" type="checkbox">
          <span data-i18n="password_toggle">ロック解除コードあり</span>
        </label>
        <input id="password" type="password" data-i18n-placeholder="password_placeholder" placeholder="パスワード" class="hidden">
      </div>

      <button id="checkBtn" type="submit" class="btn-start" data-i18n="check_button">内容を確認</button>
    </form>

    <section id="fileListSection" class="file-list-section hidden">
      <div class="file-list-header">
        <label class="select-all">
          <input id="selectAll" type="checkbox" checked>
          <span data-i18n="select_all">全部選ぶ</span>
        </label>
        <span id="selectionSummary" class="selection-summary"></span>
      </div>
      <ul id="fileList" class="file-list"></ul>
      <button id="startBtn" type="button" class="btn-start" data-i18n="start_button">受け取り開始</button>
    </section>

    <section id="manifest" class="manifest hidden" aria-live="polite">
      <ol id="manifestList"></ol>
    </section>

    <section id="resultSection" class="stamp hidden"></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
